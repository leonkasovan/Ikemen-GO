; ARM device (Linux arm64, e.g., Anbernic R36S) defaults
; These are applied on top of the base defaultConfig.ini.
[Video]
; OpenGL ES 3.2 is the only supported renderer on ARM devices.
RenderMode        = OpenGL ES 3.2
; Lower resolution to reduce GPU fill rate on Mali-class GPUs.
GameWidth         = 640
GameHeight        = 480
; Fullscreen is the only usable mode on dedicated gaming devices.
Fullscreen        = 1
; Disable MSAA to conserve GPU memory on Mali-class GPUs.
MSAA              = 0
; Disable 3D models for performance (Mali-G31 lacks the fill rate).
EnableModel       = 0
; Disable model shadows.
EnableModelShadow = 0
; Cap to display refresh rate. Uncapped rendering wastes CPU/GPU cycles.
VSync             = 1
; Use nearest-neighbor upscaling for performance.
WindowScaleMode   = 0
; Render scene at 75% of window resolution (~56% fill rate) then upscale.
; Gives ~3–4 FPS gain on Mali-G31 at 640x480. Use 1.0 to disable.
RenderScale       = 0.75
; Enable deferred sprite batching (instanced draw calls, up to 7 textures/batch).
; Draw order is preserved, so this is visually identical to immediate rendering.
EnableSpriteBatching = 1
