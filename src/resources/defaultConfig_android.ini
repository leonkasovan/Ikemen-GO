; Android device defaults
; These are applied on top of the base defaultConfig.ini.
[Video]
; OpenGL ES 3.2 is the only supported renderer on Android.
RenderMode        = OpenGL ES 3.2
; Android always runs fullscreen.
Fullscreen        = 1
; Disable MSAA to conserve GPU memory on mobile GPUs.
MSAA              = 0
; Use nearest-neighbor upscaling for performance on mobile GPUs.
WindowScaleMode   = 0
